name: MecabNativeBindings
description: Auto-generated FFI bindings for MeCab
output: lib/src/bindings_generated.dart

ffi-native:
  asset-id: 'package:mecab/src/mecab.dart'

headers:
  entry-points:
    - native/mecab/mecab/src/mecab.h

compiler-opts:
  - -Inative
  - -Inative/mecab/mecab/src

functions:
  include:
    - 'mecab_new2'
    - 'mecab_destroy'
    - 'mecab_version'
    - 'mecab_strerror'
    - 'mecab_sparse_tostr'
    - 'mecab_sparse_tonode'
    - 'mecab_model_new'
    - 'mecab_model_new2'
    - 'mecab_model_destroy'
    - 'mecab_model_new_tagger'
    - 'mecab_model_new_lattice'

structs:
  include:
    - 'mecab_node_t'
    - 'mecab_dictionary_info_t'

enums:
  exclude:
    - '.*'

typedefs:
  include:
    - 'mecab_t'
    - 'mecab_model_t'
    - 'mecab_node_t'

unions:
  exclude:
    - '.*'

macros:
  exclude:
    - '.*'

unnamed-enums:
  exclude:
    - '.*'

globals:
  exclude:
    - '.*'

silence-enum-warning: true

preamble: |
  // AUTO-GENERATED by ffigen - DO NOT EDIT
  // Run `dart run ffigen` to regenerate
  //
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
  // ignore_for_file: unused_element
  // ignore_for_file: camel_case_types
